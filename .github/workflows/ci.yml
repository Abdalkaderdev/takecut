name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit + render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Validate skills
        shell: bash
        run: for d in skills/*/; do uvx --from skills-ref agentskills validate "$d"; done
      - name: Tests
        run: uv run --no-project --with pytest python -m pytest -m "not e2e" -q

  e2e:
    name: end-to-end (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-base
      - name: Pipeline
        env:
          TAKECUT_TEST_MODEL: base
          TAKECUT_TEST_DEVICE: cpu
        run: uv run --no-project --with pytest python -m pytest -m e2e -v
